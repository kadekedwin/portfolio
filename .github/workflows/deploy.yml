# requirements:
# - nodejs 20.9+ on the server
# - passwordless sudo for the SSH user (or root user)
#
# secrets:
# - SERVER_HOST     server IP or hostname
# - SERVER_USER     SSH user
# - SERVER_SSH_KEY  private key, no passphrase
# - SERVER_PORT     optional, if SSH is not on 22
#
# variables:
# - RUNNING_PORT    port the app listens on
# - WEBSITE_URL     public site URL

name: Deploy to Production

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Create .env.production
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_WEBSITE_URL=${{ vars.WEBSITE_URL }}
          EOF
          # Also log (safely) to confirm file creation
          ls -la .env*

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Prepare Deployment Artifact
        run: |
          mkdir -p dist
          # Copy Standalone build (Use /. to include hidden .next folder)
          cp -r .next/standalone/. dist/
          # Copy Static Assets
          mkdir -p dist/.next
          cp -r .next/static dist/.next/static
          cp -r public dist/public
          # Copy .env.production configuration for runtime
          cp .env.production dist/
          # Next traces messages.json into the standalone bundle. Shipping it
          # would overwrite the contact submissions on the server every deploy.
          rm -f dist/messages.json
          # Create tarball
          tar -czf release.tar.gz -C dist .

      - name: Copy Artifact to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "release.tar.gz"
          target: "/tmp/"

      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            SERVICE_NAME="portfolio"
            SERVICE_FILE="/etc/systemd/system/${SERVICE_NAME}.service"
            USER_NAME="$(whoami)"
            APP_DIR="$HOME/${SERVICE_NAME}"

            # Ensure we know where node is
            NODE_PATH=$(which node)
            if [ -z "$NODE_PATH" ]; then
              NODE_PATH="/usr/bin/node"
            fi

            # Extract artifact (includes .env*)
            mkdir -p ${APP_DIR}
            tar -xzf /tmp/release.tar.gz -C ${APP_DIR}
            rm /tmp/release.tar.gz
            
            # Check if service exists
            if systemctl list-unit-files | grep -q "^${SERVICE_NAME}.service"; then
              echo "Service exists → restarting..."
              sudo systemctl restart ${SERVICE_NAME}
            else
              echo "Service not found → creating..."

              sudo tee "${SERVICE_FILE}" > /dev/null <<EOF
            [Unit]
            Description=${SERVICE_NAME}
            After=network.target

            [Service]
            Type=simple
            User=${USER_NAME}
            WorkingDirectory=${APP_DIR}
            Environment=NODE_ENV=production
            Environment=PORT=${{ vars.RUNNING_PORT }}
            ExecStart=${NODE_PATH} server.js
            Restart=always
            RestartSec=5
            NoNewPrivileges=true
            PrivateTmp=true
            StandardOutput=journal+append:/var/log/${SERVICE_NAME}/web.log
            StandardError=journal+append:/var/log/${SERVICE_NAME}/web.error.log

            [Install]
            WantedBy=multi-user.target
            EOF

              echo "Reloading systemd..."
              sudo systemctl daemon-reload

              echo "Enabling service..."
              sudo systemctl enable ${SERVICE_NAME}

              echo "Starting service..."
              sudo systemctl start ${SERVICE_NAME}
            fi

            echo "Done."
