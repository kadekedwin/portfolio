services:
  portfolio:
    image: ${DOCKER_IMAGE:-portfolio:latest}
    container_name: ${SERVICE_NAME:-portfolio}
    environment:
      PORT: ${PORT}
    ports:
      - "${HOST_PORT:-${PORT}}:${PORT}"
    volumes:
      - ${DATA_DIR:-./data}/messages.json:/app/messages.json
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${PORT}/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: ${SERVICE_NAME:-portfolio}-network
